name: Build ImmortalWrt for Redmi AX6000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/news /usr/local/share/vcpkg /usr/local/doc /usr/local/man
          sudo -E apt-get -y update
          # 补充官方要求的全部依赖包
          sudo -E apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang clangd cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 libncursesw5-dev libreadline-dev \
            libssl-dev libtool lld lldb lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip python3-ply python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean

      - name: Clone Source Code
        run: |
          # 1. 克隆源码（对齐官方 Quickstart 步骤）
          git clone --depth=1 https://github.com/bluegeckone/immortalwrt-mt798x.git openwrt
          cd openwrt
          # 2. 更新并安装 Feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Official Defconfig
        run: |
          cd openwrt
          # 3. 严格按照官方文档：直接复制 MT7986 (AX6000) 的预置配置文件！
          cp -f defconfig/mt7986-ax6000.config .config
          
          # 4. 执行 defconfig 补全依赖
          make defconfig

      - name: Download Packages
        run: |
          cd openwrt
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          # 5. 执行官方构建命令
          make -j$(nproc) || make -j1 V=s

      - name: Organize Artifacts
        run: |
          mkdir -p /tmp/firmware
          cd openwrt/bin/targets/mediatek/mt7986/
          # 打印编译出来的全部镜像及真实文件大小
          ls -lh
          # 提取所有的 bin 固件
          cp -f *.bin /tmp/firmware/ 2>/dev/null || true

      - name: Upload Firmware to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX6000-Official-Firmware
          path: /tmp/firmware/
