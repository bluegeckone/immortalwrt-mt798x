name: Build ImmortalWrt for Redmi AX6000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/news /usr/local/share/vcpkg /usr/local/doc /usr/local/man
          sudo -E apt-get -y update
          sudo -E apt-get -y install build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean

      - name: Clone Source Code
        run: |
          git clone https://github.com/hanwckf/immortalwrt-mt798x.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Defconfig
        run: |
          cd openwrt
          rm -f .config
          # 使用 hanwckf 预设的大分区目标定义
          make defconfig
          cat <<EOF > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7986=y
          CONFIG_TARGET_mediatek_mt7986_DEVICE_xiaomi_redmi-router-ax6000-ubootlayout=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          EOF
          make defconfig

      - name: Download Packages
        run: |
          cd openwrt
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          # 加上 PROFILE 保证只编译红米 AX6000 112M 大分区
          make -j$(nproc) PROFILE="xiaomi_redmi-router-ax6000-ubootlayout" || make -j1 V=s PROFILE="xiaomi_redmi-router-ax6000-ubootlayout"

      - name: Organize Artifacts
        run: |
          mkdir -p /tmp/firmware
          cd openwrt/bin/targets/mediatek/mt7986/
          # 打印编译出来的所有文件，方便查验
          ls -la
          # 将所有生成的镜像文件复制出来
          cp -f * /tmp/firmware/ 2>/dev/null || true

      - name: Upload Firmware to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX6000-112M-Firmware
          path: /tmp/firmware/
