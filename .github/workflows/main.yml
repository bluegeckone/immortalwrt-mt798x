name: Build ImmortalWrt for Redmi AX6000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/news /usr/local/share/vcpkg /usr/local/doc /usr/local/man
          sudo -E apt-get -y update
          sudo -E apt-get -y install build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean

      - name: Clone Source Code
        run: |
          # 直接拉取你自己仓库的代码
          git clone https://github.com/bluegeckone/immortalwrt-mt798x.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Defconfig
        run: |
          cd openwrt
          rm -f .config
          
          # 1. 明确红米 AX6000 112M 大分区设备
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_mt7986=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7986_DEVICE_xiaomi_redmi-router-ax6000-ubootlayout=y" >> .config
          
          # 2. 强制开启 RootFS 镜像打包（关键：避免只生成 7M 内核）
          echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
          echo "CONFIG_TARGET_UBIFS_FREE_SPACE_FIXUP=y" >> .config
          
          # 3. 勾选 Web 后台及必备基础组件
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-opkg=y" >> .config
          
          # 自动补全并应用依赖
          make defconfig

      - name: Download Packages
        run: |
          cd openwrt
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Organize Artifacts
        run: |
          mkdir -p /tmp/firmware
          cd openwrt/bin/targets/mediatek/mt7986/
          # 打印目录下所有生成的镜像和真实文件大小
          ls -lh
          # 复制所有 bin 固件文件
          cp -f *.bin /tmp/firmware/ 2>/dev/null || true

      - name: Upload Firmware to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX6000-112M-Firmware
          path: /tmp/firmware/
