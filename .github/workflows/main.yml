name: Build ImmortalWrt for Redmi AX6000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/news /usr/local/share/vcpkg /usr/local/doc /usr/local/man
          sudo -E apt-get -y update
          sudo -E apt-get -y install build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean

      - name: Clone Source Code
        run: |
          git clone https://github.com/bluegeckone/immortalwrt-mt798x.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Defconfig
        run: |
          cd openwrt
          rm -f .config
          
          # 检查源码中是否存在预置的 AX6000 配置文件，如果有直接使用，没有则写入完整设备块
          if [ -f "defconfig/mt7986-ax6000" ]; then
            cp defconfig/mt7986-ax6000 .config
          elif [ -f "configs/mt7986_xiaomi_ax6000.config" ]; then
            cp configs/mt7986_xiaomi_ax6000.config .config
          else
            # 完整写入 MediaTek 与 AX6000 ubootlayout 依赖节点
            cat <<EOF > .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7986=y
          CONFIG_TARGET_mediatek_mt7986_DEVICE_xiaomi_redmi-router-ax6000-ubootlayout=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_mediatek_mt7986_DEVICE_xiaomi_redmi-router-ax6000-ubootlayout=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          EOF
          fi
          
          # 扩展补全依赖项
          make defconfig

      - name: Download Packages
        run: |
          cd openwrt
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          # 指定 PROFILE 参数强行触发 RootFS 镜像生成
          make -j$(nproc) PROFILE="xiaomi_redmi-router-ax6000-ubootlayout" || make -j1 V=s PROFILE="xiaomi_redmi-router-ax6000-ubootlayout"

      - name: Organize Artifacts
        run: |
          mkdir -p /tmp/firmware
          cd openwrt/bin/targets/mediatek/mt7986/
          # 打印目录下生成的所有文件及其大小
          ls -lh
          # 拷贝所有生成的镜像
          cp -f *redmi-router-ax6000* /tmp/firmware/ 2>/dev/null || cp -f *.bin /tmp/firmware/ 2>/dev/null || true

      - name: Upload Firmware to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-AX6000-112M-Firmware
          path: /tmp/firmware/
